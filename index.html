<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1200, initial-scale=0.5">
    <title>Skyjo</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
        
        body {
            font-family: 'Press Start 2P', system-ui;
            background: linear-gradient(135deg, #0a001f, #001a00);
            color: #0f0;
            margin: 0;
            padding: 15px;
            text-align: center;
            min-width: 1400px;
            overflow-x: auto;
        }

        h1 { color: #ff0; text-shadow: 0 0 15px #ff0; }
        
        .setup { max-width: 700px; margin: 0 auto 30px; padding: 20px; background: rgba(0,30,0,0.8); border: 3px solid #0f0; border-radius: 12px; }
        
        .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; max-width: 480px; margin: 20px auto; }
        
        .card {
            width: 82px; height: 115px; 
            border: 4px solid #222; 
            border-radius: 10px;
            display: flex; 
            align-items: center; 
            justify-content: center;
            font-size: 30px; 
            font-weight: bold; 
            cursor: pointer;
            transition: all 0.25s; 
            box-shadow: 0 5px 15px rgba(0,0,0,0.7);
        }
        
        .card.back {
            background: linear-gradient(145deg, #1a0033, #330066);
            border-color: #ff0; 
            color: #ff0;
        }
        .card.back::after { content: "SKYJO"; font-size: 13px; transform: rotate(-10deg); }

        .card.empty {
            background: rgba(0, 0, 0, 0.3) !important;
            border-color: #444 !important;
            box-shadow: none;
            cursor: default;
        }
        .card.empty::after {
            content: "✓";
            font-size: 40px;
            color: #0f0;
            opacity: 0.3;
        }
        
        .card.v-negative { background: #81d4fa !important; color: #000 !important; }
        .card.v-low     { background: #81c784 !important; color: #000 !important; }
        .card.v-mid     { background: #fff176 !important; color: #000 !important; }
        .card.v-high    { background: #ef5350 !important; color: #000 !important; }
        
        .player-area { 
            border: 4px solid #cccccc; 
            padding: 15px; 
            margin: 20px auto; 
            max-width: 520px; 
            border-radius: 12px; 
            background: rgba(10,40,10,0.7);
        }
        .player-area.current {
            border-color: #0f0;
            box-shadow: 0 0 25px #ffff00;
            background: rgba(40,60,10,0.9);
        }
        .player-area.ai {
            border-color: #ff8800;
        }
        .player-area.me {
            border-color: #00ffff;
        }
        
        .center-area {
            background: rgba(0,0,0,0.6); padding: 20px; margin: 20px auto;
            max-width: 520px; border: 3px solid #ff0; border-radius: 12px;
        }
        
        #defausser-btn {
            display: block;
            margin: 15px auto;
            font-size: 18px;
            padding: 14px 32px;
        }
        
        button { 
            font-family: inherit; 
            padding: 12px 24px; 
            margin: 8px; 
            background: #220044; 
            color: #0f0; 
            border: 3px solid #0f0; 
            cursor: pointer;
        }
        button:hover { background: #440077; }
        button:disabled { opacity: 0.4; cursor: not-allowed; }
        
        .log { max-height: 200px; overflow-y: auto; background: #000; padding: 12px; text-align: left; font-size: 13px; margin: 20px auto; max-width: 800px; border: 2px solid #0f0; }
        
        #qrcode { margin: 15px auto; background: #fff; padding: 10px; display: inline-block; border-radius: 8px; }
        .room-info { font-size: 14px; margin: 10px 0; color: #ff0; }
        .waiting-list { text-align: left; max-width: 400px; margin: 10px auto; }
        .locked-msg { position: fixed; top: 80px; left: 50%; transform: translateX(-50%); background: #220044; border: 3px solid #ff0; padding: 12px 24px; z-index: 10; font-size: 16px; display: none; }
    </style>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
</head>
<body>
    <h1>SKYJO</h1>
    
    <div id="setup-screen" class="setup">
        <h2>Configuration</h2>
        <label><input type="radio" name="mode" value="multi" checked onchange="toggleMode()"> Mode Multi (2-4 joueurs locaux)</label><br><br>
        <label><input type="radio" name="mode" value="solo" onchange="toggleMode()"> Mode Solo (contre IA)</label><br><br>
        <label><input type="radio" name="mode" value="distant" onchange="toggleMode()"> Mode Distant (en ligne via QR)</label><br><br>
        
        <div id="multi-options">
            <label>Joueurs (2-4) : <input type="number" id="num-players" value="2" min="2" max="4" style="width:60px"></label><br><br>
            <div id="name-inputs"></div>
        </div>
        
        <div id="ai-options" style="display:none; margin-top:15px;">
            <label>Niveau d'IA : 
                <select id="ai-level">
                    <option value="1">Facile</option>
                    <option value="2" selected>Moyen</option>
                    <option value="3">Difficile</option>
                </select>
            </label>
        </div>
        
        <div id="distant-options" style="display:none; margin-top:15px;">
            <label>Ton pseudo : <input type="text" id="my-name" value="Joueur" style="width:180px; margin:5px;"></label><br><br>
            <button type="button" onclick="createRemoteGame()">Créer une partie (QR Code)</button>
            <br><br>
            <label>Ou rejoindre avec un code : <input type="text" id="join-code" placeholder="Code salle" style="width:120px; text-transform:uppercase;"></label>
            <button type="button" onclick="joinRemoteGame()">Rejoindre</button>
            <div id="room-wait" style="display:none; margin-top:20px;">
                <div class="room-info">Code de la salle : <strong id="room-code-display"></strong></div>
                <div id="qrcode"></div>
                <p style="font-size:12px;">Scannez le QR ou partagez le lien pour rejoindre</p>
                <div class="waiting-list" id="waiting-players"></div>
                <button id="start-remote-btn" style="display:none;" onclick="startRemoteGame()">Lancer la partie</button>
            </div>
        </div>
        
        <button id="start-local-btn" onclick="startGame()">Commencer la partie</button>
    </div>

    <div id="game-screen" style="display:none;">
        <div id="phase-title" style="font-size:24px;color:#ff0;margin:15px 0;"></div>
        <div id="current-player" style="font-size:22px;"></div>
        <div id="turn-lock-msg" class="locked-msg">Ce n'est pas ton tour — attends...</div>
        
        <div class="center-area">
            <div style="display:flex; justify-content:center; gap:40px; flex-wrap:wrap;">
                <div>
                    <strong>Pioche</strong><br>
                    <div id="deck-card" onclick="drawFromDeck()" class="card" style="width:90px;height:125px;background:#222;color:#666;cursor:pointer;margin:10px auto;">?</div>
                    <small><span id="deck-count"></span> cartes</small>
                </div>
                <div>
                    <strong>Défausse</strong><br>
                    <div id="discard-card" class="card" style="width:90px;height:125px;margin:10px auto;" onclick="takeDiscard()"></div>
                </div>
            </div>
            
            <div style="margin:25px 0;">
                <strong>Carte sélectionnée :</strong><br>
                <div id="selected-card" class="card" style="width:130px;height:175px;margin:15px auto;"></div>
            </div>
            
            <button id="defausser-btn" onclick="endTurn()">DEFAUSSER</button>
        </div>
        
        <div id="players-container"></div>
        
        <div class="log" id="log"></div>
        <button onclick="location.reload()">Nouvelle Partie</button>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDsG680YVSR2DGxCjPoQSBpVq-seGhAwyQ",
            authDomain: "gestion-absences-b1af6.firebaseapp.com",
            databaseURL: "https://gestion-absences-b1af6-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "gestion-absences-b1af6",
            storageBucket: "gestion-absences-b1af6.firebasestorage.app",
            messagingSenderId: "661333089052",
            appId: "1:661333089052:web:c8a08f407d1e1fec0778d9"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let players = [], currentPlayerIndex = 0;
        let deck = [], discardPile = [];
        let grids = [], revealed = [], cleared = [];
        let phase = 'initialReveal';
        let finishingPlayer = -1;
        let selectedCard = null;
        let selectedFromDiscard = false;
        let mustReveal = false;
        let isSoloMode = false;
        let isRemoteMode = false;
        let aiLevel = 2;
        let roomId = null;
        let myPlayerIndex = -1;
        let isHost = false;
        let remoteRef = null;
        let applyingRemote = false;
        let logMessages = [];

        function createDeck() {
            deck = [];
            for (let i = 0; i < 4; i++) deck.push(-2);
            for (let i = 0; i < 8; i++) deck.push(0);
            for (let v = 1; v <= 12; v++) for (let i = 0; i < 8; i++) deck.push(v);
            shuffle(deck);
        }

        function shuffle(a) { 
            for (let i = a.length-1; i > 0; i--) { 
                let j = Math.floor(Math.random()*(i+1)); 
                [a[i],a[j]] = [a[j],a[i]]; 
            } 
        }

        function getCardClass(v) {
            if (v <= 0) return 'v-negative';
            if (v <= 4) return 'v-low';
            if (v <= 8) return 'v-mid';
            return 'v-high';
        }

        function toggleMode() {
            const mode = document.querySelector('input[name="mode"]:checked').value;
            document.getElementById('multi-options').style.display = mode === 'multi' ? 'block' : 'none';
            document.getElementById('ai-options').style.display = mode === 'solo' ? 'block' : 'none';
            document.getElementById('distant-options').style.display = mode === 'distant' ? 'block' : 'none';
            document.getElementById('start-local-btn').style.display = mode === 'distant' ? 'none' : 'inline-block';
        }

        function generateRoomCode() {
            const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
            let code = '';
            for (let i = 0; i < 6; i++) code += chars[Math.floor(Math.random() * chars.length)];
            return code;
        }

        function createRemoteGame() {
            const name = (document.getElementById('my-name').value || 'Joueur').trim();
            roomId = generateRoomCode();
            isHost = true;
            isRemoteMode = true;
            myPlayerIndex = 0;

            const roomData = {
                host: true,
                status: 'waiting',
                players: [{ name, joinedAt: Date.now() }],
                createdAt: Date.now()
            };

            db.ref('skyjo/' + roomId).set(roomData).then(() => {
                document.getElementById('room-wait').style.display = 'block';
                document.getElementById('room-code-display').textContent = roomId;
                showQRCode();
                listenRoom();
                updateWaitingList([{ name }]);
            }).catch(err => {
                alert('Erreur Firebase : ' + err.message);
            });
        }

        function joinRemoteGame() {
            const code = (document.getElementById('join-code').value || '').trim().toUpperCase();
            const name = (document.getElementById('my-name').value || 'Joueur').trim();
            if (!code || code.length < 4) {
                alert('Entre un code de salle valide');
                return;
            }
            roomId = code;
            isHost = false;
            isRemoteMode = true;

            const ref = db.ref('skyjo/' + roomId);
            ref.once('value').then(snap => {
                if (!snap.exists()) {
                    alert('Salle introuvable');
                    return;
                }
                const data = snap.val();
                if (data.status !== 'waiting') {
                    alert('La partie a déjà commencé');
                    return;
                }
                if ((data.players || []).length >= 4) {
                    alert('Salle pleine (max 4 joueurs)');
                    return;
                }
                const newPlayers = [...(data.players || []), { name, joinedAt: Date.now() }];
                myPlayerIndex = newPlayers.length - 1;
                ref.update({ players: newPlayers }).then(() => {
                    document.getElementById('room-wait').style.display = 'block';
                    document.getElementById('room-code-display').textContent = roomId;
                    showQRCode();
                    listenRoom();
                });
            }).catch(err => alert('Erreur : ' + err.message));
        }

        function showQRCode() {
            const url = window.location.href.split('?')[0] + '?room=' + roomId;
            const qrDiv = document.getElementById('qrcode');
            qrDiv.innerHTML = '';
            QRCode.toCanvas(document.createElement('canvas'), url, { width: 180, margin: 1 }, (err, canvas) => {
                if (!err) qrDiv.appendChild(canvas);
                else qrDiv.innerHTML = '<p style="color:#f00">QR erreur</p><p style="font-size:11px;word-break:break-all">' + url + '</p>';
            });
            const link = document.createElement('p');
            link.style.fontSize = '11px';
            link.style.wordBreak = 'break-all';
            link.innerHTML = '<a href="' + url + '" style="color:#0ff">' + url + '</a>';
            qrDiv.appendChild(link);
        }

        function listenRoom() {
            remoteRef = db.ref('skyjo/' + roomId);
            remoteRef.on('value', snap => {
                const data = snap.val();
                if (!data) return;

                if (data.status === 'waiting') {
                    updateWaitingList(data.players || []);
                    if (isHost && (data.players || []).length >= 2) {
                        document.getElementById('start-remote-btn').style.display = 'inline-block';
                    }
                } else if (data.status === 'playing' || data.status === 'ended') {
                    applyRemoteState(data);
                }
            });
        }

        function updateWaitingList(plist) {
            const el = document.getElementById('waiting-players');
            el.innerHTML = '<strong>Joueurs connectés (' + plist.length + '/4) :</strong><ul>' +
                plist.map((p, i) => '<li>' + (p.name || 'Joueur') + (i === 0 ? ' (hôte)' : '') + '</li>').join('') +
                '</ul>';
        }

        function startRemoteGame() {
            if (!isHost) return;
            remoteRef.once('value').then(snap => {
                const data = snap.val();
                const plist = data.players || [];
                if (plist.length < 2) {
                    alert('Il faut au moins 2 joueurs');
                    return;
                }
                players = plist.map(p => p.name || 'Joueur');
                createDeck();
                grids = [];
                revealed = [];
                cleared = [];
                for (let i = 0; i < players.length; i++) {
                    grids.push(Array.from({ length: 12 }, () => deck.pop()));
                    revealed.push([]);
                    cleared.push([]);
                }
                discardPile = [deck.pop()];
                phase = 'initialReveal';
                currentPlayerIndex = 0;
                selectedCard = null;
                selectedFromDiscard = false;
                mustReveal = false;
                finishingPlayer = -1;
                logMessages = ['=== Partie distante démarrée ==='];

                pushFullState('playing');
            });
        }

        function pushFullState(status) {
            if (!isRemoteMode || !remoteRef) return;
            const state = {
                status: status || 'playing',
                players: players.map((n) => ({ name: n })),
                deck,
                discardPile,
                grids,
                revealed: revealed.map(s => Array.isArray(s) ? s : Array.from(s)),
                cleared: cleared.map(s => Array.isArray(s) ? s : Array.from(s)),
                phase,
                currentPlayerIndex,
                selectedCard,
                selectedFromDiscard,
                mustReveal,
                finishingPlayer,
                logMessages: logMessages.slice(-40)
            };
            remoteRef.update(state);
        }

        function applyRemoteState(data) {
            if (applyingRemote) return;
            applyingRemote = true;
            try {
                players = (data.players || []).map(p => p.name || 'Joueur');
                deck = data.deck || [];
                discardPile = data.discardPile || [];
                grids = data.grids || [];
                revealed = (data.revealed || []).map(arr => new Set(arr || []));
                cleared = (data.cleared || []).map(arr => new Set(arr || []));
                phase = data.phase || 'playing';
                currentPlayerIndex = data.currentPlayerIndex ?? 0;
                selectedCard = data.selectedCard ?? null;
                selectedFromDiscard = !!data.selectedFromDiscard;
                mustReveal = !!data.mustReveal;
                finishingPlayer = data.finishingPlayer ?? -1;
                logMessages = data.logMessages || [];

                if (document.getElementById('setup-screen').style.display !== 'none') {
                    document.getElementById('setup-screen').style.display = 'none';
                    document.getElementById('game-screen').style.display = 'block';
                }

                const logEl = document.getElementById('log');
                logEl.innerHTML = logMessages.map(m => '<div>' + m + '</div>').join('');
                logEl.scrollTop = logEl.scrollHeight;

                updatePhase();
                renderAll();
                updateTurnLockUI();
            } finally {
                applyingRemote = false;
            }
        }

        function canInteract() {
            if (!isRemoteMode) return true;
            if (phase === 'ended') return false;
            return myPlayerIndex === currentPlayerIndex;
        }

        function updateTurnLockUI() {
            const msg = document.getElementById('turn-lock-msg');
            if (isRemoteMode && !canInteract() && phase !== 'ended') {
                msg.style.display = 'block';
                msg.textContent = 'Tour de ' + (players[currentPlayerIndex] || '...') + ' — tu ne peux pas jouer';
            } else {
                msg.style.display = 'none';
            }
        }

        function startGame() {
            const mode = document.querySelector('input[name="mode"]:checked').value;
            isSoloMode = mode === 'solo';
            isRemoteMode = false;
            
            if (isSoloMode) {
                aiLevel = parseInt(document.getElementById('ai-level').value);
            }

            players = isSoloMode ? ["Vous", "IA"] : [];
   
            if (!isSoloMode) {
                const n = parseInt(document.getElementById('num-players').value) || 2;
                for (let i = 0; i < n; i++) {
                    const input = document.getElementById(`p${i}`);
                    players.push((input ? input.value.trim() : '') || `Joueur ${i+1}`);
                }
            }
            
            createDeck();
            grids = []; revealed = []; cleared = [];
            for (let i = 0; i < players.length; i++) {
                grids.push(Array.from({length:12}, () => deck.pop()));
                revealed.push(new Set());
                cleared.push(new Set());
            }
            
            discardPile = [deck.pop()];
            
            document.getElementById('setup-screen').style.display = 'none';
            document.getElementById('game-screen').style.display = 'block';
            
            phase = 'initialReveal';
            currentPlayerIndex = 0;
            selectedCard = null;
            selectedFromDiscard = false;
            mustReveal = false;
            finishingPlayer = -1;
            logMessages = [];
            
            updatePhase();
            renderAll();
            
            if (isSoloMode && currentPlayerIndex === 1) setTimeout(aiInitialReveal, 600);
        }

        function updatePhase() {
            document.getElementById('phase-title').textContent = phase === 'initialReveal' ? "Phase initiale : Retourne 2 cartes chacun" : (phase === 'ended' ? "Partie terminée" : "");
            const name = players[currentPlayerIndex] || '?';
            document.getElementById('current-player').innerHTML = `<strong>${name} → À ton tour</strong>` +
                (isRemoteMode ? (canInteract() ? ' <span style="color:#0f0">(c\'est toi)</span>' : ' <span style="color:#f80">(attends)</span>') : '');
        }

        function renderAll() {
            const container = document.getElementById('players-container');
            container.innerHTML = '';

            players.forEach((name, idx) => {
                const area = document.createElement('div');
                let cls = 'player-area';
                if (idx === currentPlayerIndex) cls += ' current';
                if (name === "IA") cls += ' ai';
                if (isRemoteMode && idx === myPlayerIndex) cls += ' me';
                area.className = cls;
                const youLabel = (isRemoteMode && idx === myPlayerIndex) ? ' (toi)' : '';
                area.innerHTML = `<h2>${name}${youLabel} ${idx === currentPlayerIndex ? '→ À TOI !' : ''}</h2>`;
                
                const gridEl = document.createElement('div');
                gridEl.className = 'grid';
                
                const rev = revealed[idx] instanceof Set ? revealed[idx] : new Set(revealed[idx] || []);
                const clr = cleared[idx] instanceof Set ? cleared[idx] : new Set(cleared[idx] || []);
                
                (grids[idx] || []).forEach((value, pos) => {
                    const cardEl = document.createElement('div');
                    if (clr.has(pos)) {
                        cardEl.className = 'card empty';
                    } else if (rev.has(pos) || (name === "IA" && phase === 'ended') || phase === 'ended') {
                        cardEl.className = `card ${getCardClass(value)}`;
                        cardEl.textContent = value;
                    } else {
                        cardEl.className = 'card back';
                        cardEl.textContent = '';
                    }
                    
                    const isMyTurn = !isRemoteMode ? (idx === currentPlayerIndex && name !== "IA") : (idx === myPlayerIndex && canInteract());
                    if (isMyTurn && !clr.has(pos) && phase !== 'ended') {
                        cardEl.onclick = () => cardClicked(idx, pos);
                    }
                    gridEl.appendChild(cardEl);
                });
                area.appendChild(gridEl);
                container.appendChild(area);
            });
            
            document.getElementById('deck-count').textContent = deck.length;
            updateSelectedVisual();
            updateDiscardVisual();

            const defausserBtn = document.getElementById('defausser-btn');
            const canAct = canInteract() && phase === 'playing';
            defausserBtn.disabled = !canAct || (selectedCard === null && !mustReveal) || (players[currentPlayerIndex] === "IA");
            
            const deckCard = document.getElementById('deck-card');
            const discardEl = document.getElementById('discard-card');
            if (deckCard) {
                deckCard.style.opacity = canAct && selectedCard === null ? '1' : '0.5';
                deckCard.style.pointerEvents = canAct && selectedCard === null ? 'auto' : 'none';
            }
            if (discardEl) {
                discardEl.style.opacity = canAct && selectedCard === null && discardPile.length > 0 ? '1' : '0.5';
                discardEl.style.pointerEvents = canAct && selectedCard === null ? 'auto' : 'none';
            }
            updateTurnLockUI();
        }

        function cardClicked(playerIdx, pos) {
            if (phase === 'ended') return;
            if (isRemoteMode) {
                if (playerIdx !== myPlayerIndex || !canInteract()) return;
            } else {
                if (playerIdx !== currentPlayerIndex || players[playerIdx] === "IA") return;
            }
            if (cleared[playerIdx] instanceof Set ? cleared[playerIdx].has(pos) : (cleared[playerIdx]||[]).includes(pos)) return;
            
            if (!(revealed[playerIdx] instanceof Set)) revealed[playerIdx] = new Set(revealed[playerIdx] || []);
            if (!(cleared[playerIdx] instanceof Set)) cleared[playerIdx] = new Set(cleared[playerIdx] || []);
            
            if (phase === 'initialReveal') {
                if (!revealed[playerIdx].has(pos)) {
                    revealed[playerIdx].add(pos);
                    log(`${players[playerIdx]} retourne : ${grids[playerIdx][pos]}`);
                    renderAll();
                    if (revealed[playerIdx].size >= 2) nextInitialPlayer();
                    else if (isRemoteMode) pushFullState();
                }
                return;
            }
            
            if (selectedCard !== null) {
                const oldCard = grids[playerIdx][pos];
                grids[playerIdx][pos] = selectedCard;
                revealed[playerIdx].add(pos);
                discardPile.push(oldCard);
                log(`Échange : ${oldCard} → défausse`);
                
                selectedCard = null;
                selectedFromDiscard = false;
                mustReveal = false;
                checkColumns(playerIdx);
                renderAll();
                log(`Tour terminé (échange effectué)`);
                nextPlayer();
                return;
            } 
            else if (mustReveal && !revealed[playerIdx].has(pos)) {
                revealed[playerIdx].add(pos);
                log(`Tu retournes : ${grids[playerIdx][pos]}`);
                mustReveal = false;
                renderAll();
                nextPlayer();
            }
        }

        function checkColumns(pIdx) {
            if (!(revealed[pIdx] instanceof Set)) revealed[pIdx] = new Set(revealed[pIdx] || []);
            if (!(cleared[pIdx] instanceof Set)) cleared[pIdx] = new Set(cleared[pIdx] || []);
            for (let c = 0; c < 4; c++) {
                const ids = [c, c+4, c+8];
                if (ids.every(x => revealed[pIdx].has(x) && !cleared[pIdx].has(x))) {
                    const vals = ids.map(x => grids[pIdx][x]);
                    if (vals.every(v => v === vals[0])) {
                        ids.forEach(x => {
                            discardPile.push(grids[pIdx][x]);
                            cleared[pIdx].add(x);
                            revealed[pIdx].delete(x);
                        });
                        log(`✅ Colonne de ${vals[0]} complétée ! Cartes ajoutées à la défausse.`);
                    }
                }
            }
        }

        function nextInitialPlayer() {
            currentPlayerIndex = (currentPlayerIndex + 1) % players.length;
            
            if (players.every((_, i) => {
                const r = revealed[i] instanceof Set ? revealed[i] : new Set(revealed[i] || []);
                return r.size >= 2;
            })) {
                phase = 'playing';
                determineStarter();
            } else {
                updatePhase();
                renderAll();
                if (isRemoteMode) pushFullState();
                
                if (isSoloMode && players[currentPlayerIndex] === "IA") {
                    setTimeout(aiInitialReveal, 600);
                }
            }
        }

        function determineStarter() {
            log("=== Qui commence ? ===");
            let bestScore = -Infinity;
            let bestPlayer = 0;
            let bestHighCard = -Infinity;

            for (let i = 0; i < players.length; i++) {
                const rev = revealed[i] instanceof Set ? revealed[i] : new Set(revealed[i] || []);
                const revealedArr = Array.from(rev).slice(0, 2);
                const cards = revealedArr.map(idx => grids[i][idx]);
                
                const sum = cards.reduce((a, b) => a + b, 0);
                const highestCard = Math.max(...cards);

                log(`${players[i]} → ${cards.join(" + ")} = ${sum} (plus haute : ${highestCard})`);

                let isBetter = false;
                if (sum > bestScore) {
                    isBetter = true;
                } else if (sum === bestScore && highestCard > bestHighCard) {
                    isBetter = true;
                }

                if (isBetter) {
                    bestScore = sum;
                    bestHighCard = highestCard;
                    bestPlayer = i;
                }
            }

            currentPlayerIndex = bestPlayer;
            log(`<strong>${players[bestPlayer]} commence ! (score ${bestScore})</strong>`);
            
            updatePhase();
            renderAll();
            if (isRemoteMode) pushFullState();

            if (isSoloMode && bestPlayer === 1) {
                setTimeout(aiPlay, 800);
            }
        }

        function reshuffleDiscardIntoDeck() {
            if (discardPile.length <= 1) return false;
            const topCard = discardPile.pop();
            deck = discardPile;
            discardPile = [topCard];
            shuffle(deck);
            log("🔄 Pioche vide → Défausse mélangée");
            return true;
        }

        function drawFromDeck() {
            if (phase !== 'playing' || selectedCard !== null || phase === 'ended') return;
            if (!canInteract()) return;
            if (players[currentPlayerIndex] === "IA") return;
            if (deck.length === 0) if (!reshuffleDiscardIntoDeck()) return;
            selectedCard = deck.pop();
            selectedFromDiscard = false;
            log(`Tu as pioché : ${selectedCard}`);
            updateSelectedVisual();
            renderAll();
            if (isRemoteMode) pushFullState();
        }

        function takeDiscard() {
            if (phase !== 'playing' || selectedCard !== null || discardPile.length === 0 || phase === 'ended') return;
            if (!canInteract()) return;
            if (players[currentPlayerIndex] === "IA") return;
            selectedCard = discardPile.pop();
            selectedFromDiscard = true;
            log(`Tu as pris la défausse : ${selectedCard}`);
            updateSelectedVisual();
            renderAll();
            if (isRemoteMode) pushFullState();
        }

        function updateSelectedVisual() {
            const el = document.getElementById('selected-card');
            if (selectedCard !== null) {
                el.textContent = selectedCard;
                el.className = `card ${getCardClass(selectedCard)}`;
                el.style.borderColor = selectedFromDiscard ? '#ff8800' : '';
                el.style.boxShadow = selectedFromDiscard ? '0 0 25px #ff8800' : '0 0 30px #ffff00';
            } else {
                el.textContent = '—';
                el.className = 'card';
                el.style.background = '#222';
                el.style.boxShadow = 'none';
            }
        }

        function updateDiscardVisual() {
            const el = document.getElementById('discard-card');
            if (discardPile.length > 0) {
                const v = discardPile[discardPile.length-1];
                el.textContent = v;
                el.className = `card ${getCardClass(v)}`;
            } else {
                el.textContent = '';
                el.className = 'card back';
            }
        }

        function endTurn() {
            if (phase !== 'playing' || phase === 'ended') return;
            if (!canInteract()) return;
            if (players[currentPlayerIndex] === "IA") return;
            if (selectedCard !== null) {
                if (selectedFromDiscard) {
                    log("❌ Impossible de défausser une carte prise de la défausse !");
                    return;
                }
                discardPile.push(selectedCard);
                log(`Carte défaussée. Retourne maintenant une carte cachée.`);
                selectedCard = null;
                selectedFromDiscard = false;
                mustReveal = true;
                updateSelectedVisual();
                updateDiscardVisual();
                renderAll();
                if (isRemoteMode) pushFullState();
                return;
            }
            nextPlayer();
        }

        function nextPlayer() {
            if (
                finishingPlayer === -1 &&
                (() => {
                    const r = revealed[currentPlayerIndex] instanceof Set ? revealed[currentPlayerIndex] : new Set(revealed[currentPlayerIndex] || []);
                    const c = cleared[currentPlayerIndex] instanceof Set ? cleared[currentPlayerIndex] : new Set(cleared[currentPlayerIndex] || []);
                    return r.size + c.size === 12;
                })()
            ) {
                finishingPlayer = currentPlayerIndex;
                log("<strong>" + players[currentPlayerIndex] + " a terminé sa grille !</strong>");
            }

            currentPlayerIndex++;
            if (currentPlayerIndex >= players.length) {
                currentPlayerIndex = 0;
            }

            if (
                finishingPlayer !== -1 &&
                currentPlayerIndex === finishingPlayer
            ) {
                endRound();
                return;
            }

            updatePhase();
            renderAll();
            if (isRemoteMode) pushFullState();

            if (
                isSoloMode &&
                players[currentPlayerIndex] === "IA"
            ) {
                setTimeout(aiPlay, 700);
            }
        }

        function endRound() {
            phase = 'ended';
            log("=== MANCHE TERMINÉE ===");
            players.forEach((_,i) => { 
                if (!(revealed[i] instanceof Set)) revealed[i] = new Set(revealed[i] || []);
                for(let j=0; j<12; j++) revealed[i].add(j); 
            });
            renderAll();
            
            let scores = players.map((n,i) => {
                let score = 0;
                const clr = cleared[i] instanceof Set ? cleared[i] : new Set(cleared[i] || []);
                for(let j=0; j<12; j++) if (!clr.has(j)) score += grids[i][j];
                return {name: n, score};
            }).sort((a,b) => a.score - b.score);
            
            scores.forEach(s => log(`${s.name} : ${s.score} points`));
            log("<strong>Partie terminée !</strong>");
            if (isRemoteMode) pushFullState('ended');
        }

        function log(m) {
            logMessages.push(m);
            const logEl = document.getElementById('log');
            logEl.innerHTML += `<div>${m}</div>`;
            logEl.scrollTop = logEl.scrollHeight;
        }

        function updateNameInputs() {
            const n = Math.max(2, Math.min(4, parseInt(document.getElementById('num-players').value) || 2));
            let html = '';
            for (let i = 0; i < n; i++) {
                html += `Joueur ${i+1} : <input id="p${i}" value="Joueur ${i+1}" style="margin:5px;width:180px;"><br>`;
            }
            document.getElementById('name-inputs').innerHTML = html;
        }

        function aiInitialReveal() {
            if (phase !== 'initialReveal') return;
            
            const positions = [];
            for (let i = 0; i < 12; i++) positions.push(i);
            shuffle(positions);
            
            if (!(revealed[1] instanceof Set)) revealed[1] = new Set();
            revealed[1].add(positions[0]);
            revealed[1].add(positions[1]);
            
            log(`IA (${getAiName()}) a retourné 2 cartes`);
            renderAll();
            nextInitialPlayer();
        }

        function aiPlay() {
            if (phase !== "playing" || players[currentPlayerIndex] !== "IA") return;

            setTimeout(() => {
                if (deck.length === 0) reshuffleDiscardIntoDeck();

                const discardValue = discardPile.length ? discardPile[discardPile.length - 1] : null;
                let selected = null;
                let fromDiscard = false;

                if (discardValue !== null && shouldTakeDiscard(discardValue)) {
                    selected = discardPile.pop();
                    fromDiscard = true;
                    log(`IA (${getAiName()}) prend la défausse (${selected})`);
                } else {
                    selected = deck.pop();
                    fromDiscard = false;
                    log(`IA (${getAiName()}) pioche`);
                }

                renderAll();

                setTimeout(() => {
                    makeBestMove(selected, fromDiscard);
                }, aiLevel === 3 ? 500 : 700);

            }, 600);
        }

        function getAiName() {
            return aiLevel === 1 ? "Facile" : aiLevel === 2 ? "Moyen" : "Difficile";
        }

        function shouldTakeDiscard(value) {
            let highestVisible = -99;
            if (!(revealed[1] instanceof Set)) revealed[1] = new Set(revealed[1] || []);
            if (!(cleared[1] instanceof Set)) cleared[1] = new Set(cleared[1] || []);
            for (let i = 0; i < 12; i++) {
                if (!cleared[1].has(i) && revealed[1].has(i)) {
                    highestVisible = Math.max(highestVisible, grids[1][i]);
                }
            }
            return value < highestVisible - (aiLevel === 3 ? 2 : 0);
        }

        function makeBestMove(newCard, fromDiscard) {
            let bestPos = -1;
            let bestScore = -Infinity;

            if (!(revealed[1] instanceof Set)) revealed[1] = new Set(revealed[1] || []);
            if (!(cleared[1] instanceof Set)) cleared[1] = new Set(cleared[1] || []);

            for (let pos = 0; pos < 12; pos++) {
                if (cleared[1].has(pos)) continue;
                let score = evaluateMove(pos, newCard);
                if (score > bestScore) {
                    bestScore = score;
                    bestPos = pos;
                }
            }

            if (bestScore < 0 || (aiLevel === 1 && Math.random() < 0.4)) {
                discardPile.push(newCard);
                log(`IA (${getAiName()}) défausse et retourne une carte`);
                let target = chooseRevealPosition();
                if (target !== -1) {
                    revealed[1].add(target);
                }
            } else {
                const old = grids[1][bestPos];
                grids[1][bestPos] = newCard;
                discardPile.push(old);
                revealed[1].add(bestPos);
                log(`IA (${getAiName()}) échange ${old} → ${newCard}`);
            }

            checkColumns(1);
            renderAll();
            nextPlayer();
        }

        function evaluateMove(pos, newCard) {
            const old = grids[1][pos];
            let score = old - newCard;

            if (aiLevel >= 2) {
                const col = pos % 4;
                const colPositions = [col, col+4, col+8];
                let sameCount = 0;
                let potential = 0;

                for (let p of colPositions) {
                    if (p === pos) continue;
                    if (revealed[1].has(p)) {
                        if (grids[1][p] === newCard) sameCount++;
                    } else {
                        potential++;
                    }
                }
                score += sameCount * 25 + potential * 8;
            }
            return score;
        }

        function chooseRevealPosition() {
            let candidates = [];
            for (let i = 0; i < 12; i++) {
                if (!revealed[1].has(i) && !cleared[1].has(i)) {
                    candidates.push(i);
                }
            }
            if (candidates.length === 0) return -1;
            return candidates[Math.floor(Math.random() * candidates.length)];
        }

        function checkUrlRoom() {
            const params = new URLSearchParams(window.location.search);
            const r = params.get('room');
            if (r) {
                document.querySelector('input[name="mode"][value="distant"]').checked = true;
                toggleMode();
                document.getElementById('join-code').value = r.toUpperCase();
            }
        }

        document.getElementById('num-players').addEventListener('input', updateNameInputs);
        window.onload = function() {
            updateNameInputs();
            checkUrlRoom();
        };
    </script>
</body>
</html>
